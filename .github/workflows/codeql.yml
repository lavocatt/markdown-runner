name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # the bot dispatches it on its branches (its pushes don't trigger workflows)

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
